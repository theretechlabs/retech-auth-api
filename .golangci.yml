# golangci-lint v2 — https://golangci-lint.run/usage/configuration/
# Conjunto moderado que passa no código atual. Itens excluídos abaixo estão
# documentados em SECURITY.md (backlog de hardening) ou são falsos positivos.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - misspell
    - gocritic
    - revive

  settings:
    govet:
      disable:
        # Analisador "inline" depende da versão do toolchain que compilou o
        # linter vs. a diretiva `go` do go.mod; gera falso positivo em io/ioutil.
        - inline

    staticcheck:
      checks:
        # Conjunto padrão do golangci-lint para staticcheck (ST10xx de estilo desligados)
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # SA1019: uso de APIs deprecadas (http.CloseNotifier em cmd/api/main.go,
        # strings.Title em cmd/tools/tenant_setup, io/ioutil em docs_handler).
        # Trocar altera comportamento; fica para PR dedicada.
        - -SA1019
        # QF*: sugestões de refatoração puramente estilísticas (quickfix).
        - -QF1003
        - -QF1006
        - -QF1012

    gosec:
      excludes:
        # G104 duplica errcheck
        - G104
        # G112: http.Server sem ReadHeaderTimeout — item 10 do backlog em SECURITY.md
        - G112
        # G706: "log injection" por taint analysis em CLIs locais (cmd/migrate); ruído.
        - G706

    gocritic:
      disabled-checks:
        # exitAfterDefer: log.Fatalf após `defer db.Close()` nos mains; corrigir
        # exige reestruturar os binários (fora do escopo desta PR).
        - exitAfterDefer
        # ifElseChain: preferência estilística (if/else vs switch).
        - ifElseChain

    revive:
      rules:
        # Regras padrão do revive, exceto as duas abaixo: o código legado não
        # documenta identificadores exportados (46 ocorrências) nem pacotes.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    misspell:
      locale: US
      ignore-rules:
        # Palavras em português que o dicionário en-US confunde com typos
        - comando
        - comandos
        - administrativo
        - clientes
        - individuais
        - inferir
        - calcular

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Testes podem ignorar erros e usar valores fixos
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # G202: concatenação apenas de " AND active = $N" (placeholder numerado, sem input do usuário)
      - path: internal/infrastructure/repository/postgres_auth_repository\.go
        linters: [gosec]
        text: "G202"
      # SA4010: slice `toAdd` calculado e nunca usado em UpdateUserRoles (código morto,
      # sem efeito em runtime). Remover em PR de limpeza.
      - path: internal/application/usecase/user_management_usecase\.go
        linters: [staticcheck]
        text: "SA4010"
      # SA9003: branch vazio intencional em DeleteRole (erro de desvincular permissões
      # é ignorado de propósito, com comentário explicando). Decisão de produto.
      - path: internal/application/usecase/management_usecase\.go
        linters: [staticcheck]
        text: "SA9003"

issues:
  # Não esconder ocorrências repetidas: o CI deve mostrar tudo.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable: []
